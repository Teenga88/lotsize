<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot Size Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --border: #2a2a3d;
    --accent: #00e5a0;
    --accent2: #0066ff;
    --loss: #ff3b5c;
    --warn: #ffb800;
    --text: #e8e8f0;
    --muted: #6b6b8a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 440px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(0,229,160,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }

  .instrument-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.2);
    border-radius: 20px;
    padding: 4px 12px;
  }

  /* MODE TOGGLE */
  .mode-toggle {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
  }

  .mode-btn {
    flex: 1;
    padding: 8px;
    border-radius: 5px;
    border: none;
    background: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  .mode-btn.active {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }

  /* INPUT GRID */
  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .input-group.full { grid-column: span 2; }

  .input-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    padding-right: 42px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  .input-wrap input:focus {
    border-color: var(--accent);
  }

  .input-unit {
    position: absolute;
    right: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    pointer-events: none;
  }

  /* RISK DISPLAY */
  .risk-preview {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .risk-preview-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  .risk-preview-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--warn);
  }

  /* INSTRUMENT SELECTOR */
  .instrument-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 14px;
  }

  .inst-btn {
    padding: 7px 4px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .inst-btn.active {
    background: rgba(0,229,160,0.08);
    border-color: rgba(0,229,160,0.35);
    color: var(--accent);
  }

  /* CALC BUTTON */
  .calc-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #000;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.08em;
    margin-bottom: 16px;
  }

  .calc-btn:hover { opacity: 0.88; transform: translateY(-1px); }
  .calc-btn:active { transform: translateY(0); }

  /* RESULT */
  .result-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: none;
    animation: slideIn 0.25s ease-out;
  }

  .result-card.show { display: block; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-main {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    margin-bottom: 4px;
  }

  .result-lot {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 42px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .result-lot-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .result-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .result-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .result-row-label {
    font-size: 10px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .result-row-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .result-row-val.accent { color: var(--accent); }
  .result-row-val.warn { color: var(--warn); }

  /* LOT TYPES */
  .lot-types {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .lot-type-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 10px;
    text-align: center;
  }

  .lot-type-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .lot-type-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
  }

  .lot-type-val.standard { color: var(--accent); }
  .lot-type-val.mini { color: var(--text); }
  .lot-type-val.micro { color: var(--muted); }

  /* ERROR */
  .error-msg {
    background: rgba(255,59,92,0.08);
    border: 1px solid rgba(255,59,92,0.25);
    border-radius: 7px;
    padding: 10px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--loss);
    display: none;
    margin-bottom: 12px;
  }

  .error-msg.show { display: block; }

  /* SAVE LAST */
  .save-row {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .save-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    flex: 1;
  }

  .save-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 10px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .save-btn:hover { color: var(--accent); border-color: var(--accent); }

  @media (max-width: 380px) {
    .result-lot { font-size: 34px; }
    .input-grid { grid-template-columns: 1fr; }
    .input-group.full { grid-column: span 1; }
  }
</style>
</head>
<body>
<div class="card">

  <!-- HEADER -->
  <div class="header">
    <div class="title">Lot Size Calc</div>
    <div class="instrument-badge" id="inst-badge">XAU/USD</div>
  </div>

  <!-- INSTRUMENT -->
  <div class="instrument-row">
    <button class="inst-btn active" onclick="setInst('XAUUSD', this)">XAU/USD</button>
    <button class="inst-btn" onclick="setInst('EURUSD', this)">EUR/USD</button>
    <button class="inst-btn" onclick="setInst('GBPUSD', this)">GBP/USD</button>
    <button class="inst-btn" onclick="setInst('USDJPY', this)">USD/JPY</button>
    <button class="inst-btn" onclick="setInst('GBPJPY', this)">GBP/JPY</button>
    <button class="inst-btn" onclick="setInst('BTCUSD', this)">BTC/USD</button>
  </div>

  <!-- MODE TOGGLE -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="mode-pips" onclick="setMode('pips')">Stop Loss Pips</button>
    <button class="mode-btn" id="mode-price" onclick="setMode('price')">Stop Loss Price</button>
  </div>

  <!-- INPUTS -->
  <div class="input-grid">
    <div class="input-group">
      <div class="input-label">Balance (USD)</div>
      <div class="input-wrap">
        <input type="number" id="i-balance" placeholder="5745.30" value="" inputmode="decimal">
        <span class="input-unit">USD</span>
      </div>
    </div>
    <div class="input-group">
      <div class="input-label">Risk %</div>
      <div class="input-wrap">
        <input type="number" id="i-risk" placeholder="10" value="10" inputmode="decimal">
        <span class="input-unit">%</span>
      </div>
    </div>

    <!-- PIPS MODE -->
    <div class="input-group full" id="pips-input">
      <div class="input-label">Stop Loss (pips)</div>
      <div class="input-wrap">
        <input type="number" id="i-pips" placeholder="20" inputmode="decimal">
        <span class="input-unit">pips</span>
      </div>
    </div>

    <!-- PRICE MODE -->
    <div class="input-group" id="entry-input" style="display:none;">
      <div class="input-label">Entry Price</div>
      <div class="input-wrap">
        <input type="number" id="i-entry" placeholder="3245.00" step="any" inputmode="decimal">
      </div>
    </div>
    <div class="input-group" id="sl-input" style="display:none;">
      <div class="input-label">Stop Loss Price</div>
      <div class="input-wrap">
        <input type="number" id="i-sl" placeholder="3240.00" step="any" inputmode="decimal">
      </div>
    </div>
  </div>

  <!-- RISK PREVIEW -->
  <div class="risk-preview">
    <span class="risk-preview-label">Risk Amount</span>
    <span class="risk-preview-val" id="risk-amount">— USD</span>
  </div>

  <!-- ERROR -->
  <div class="error-msg" id="error-msg"></div>

  <!-- CALC BTN -->
  <button class="calc-btn" onclick="calculate()">⚡ CALCULATE</button>

  <!-- RESULT -->
  <div class="result-card" id="result-card">
    <div class="result-main">
      <div class="result-lot" id="r-lot">—</div>
      <div class="result-lot-label">Lots</div>
    </div>
    <div class="result-sub" id="r-sub">—</div>

    <div class="result-grid">
      <div class="result-row">
        <div class="result-row-label">Risk Amount</div>
        <div class="result-row-val warn" id="r-risk">—</div>
      </div>
      <div class="result-row">
        <div class="result-row-label">Pip Value</div>
        <div class="result-row-val" id="r-pipval">—</div>
      </div>
      <div class="result-row">
        <div class="result-row-label">Units</div>
        <div class="result-row-val" id="r-units">—</div>
      </div>
      <div class="result-row">
        <div class="result-row-label">SL Distance</div>
        <div class="result-row-val" id="r-sl">—</div>
      </div>
    </div>

    <div class="lot-types">
      <div class="lot-type-item">
        <div class="lot-type-label">Standard (1.0)</div>
        <div class="lot-type-val standard" id="r-standard">—</div>
      </div>
      <div class="lot-type-item">
        <div class="lot-type-label">Mini (0.1)</div>
        <div class="lot-type-val mini" id="r-mini">—</div>
      </div>
      <div class="lot-type-item">
        <div class="lot-type-label">Micro (0.01)</div>
        <div class="lot-type-val micro" id="r-micro">—</div>
      </div>
    </div>

    <div class="save-row">
      <span class="save-label" id="save-label">—</span>
      <button class="save-btn" onclick="saveToMemory()">💾 บันทึก</button>
    </div>
  </div>

</div>

<script>
// ===== INSTRUMENTS =====
// pipSize: size of 1 pip in price terms
// pipValuePer1Lot: USD value of 1 pip per 1 standard lot (approximate for USD account)
const INSTRUMENTS = {
  XAUUSD:  { label: 'XAU/USD', pipSize: 0.1,    pipValue100k: 10,    units: 100 },
  EURUSD:  { label: 'EUR/USD', pipSize: 0.0001,  pipValue100k: 10,    units: 100000 },
  GBPUSD:  { label: 'GBP/USD', pipSize: 0.0001,  pipValue100k: 10,    units: 100000 },
  USDJPY:  { label: 'USD/JPY', pipSize: 0.01,    pipValue100k: 9.09,  units: 100000 },
  GBPJPY:  { label: 'GBP/JPY', pipSize: 0.01,    pipValue100k: 9.09,  units: 100000 },
  BTCUSD:  { label: 'BTC/USD', pipSize: 1,       pipValue100k: 1,     units: 1 },
};

let currentInst = 'XAUUSD';
let currentMode = 'pips'; // 'pips' | 'price'

function setInst(key, btn) {
  currentInst = key;
  document.getElementById('inst-badge').textContent = INSTRUMENTS[key].label;
  document.querySelectorAll('.inst-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateRiskPreview();
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-pips').classList.toggle('active', mode==='pips');
  document.getElementById('mode-price').classList.toggle('active', mode==='price');
  document.getElementById('pips-input').style.display = mode==='pips' ? '' : 'none';
  document.getElementById('entry-input').style.display = mode==='price' ? '' : 'none';
  document.getElementById('sl-input').style.display = mode==='price' ? '' : 'none';
}

function updateRiskPreview() {
  const bal = parseFloat(document.getElementById('i-balance').value);
  const risk = parseFloat(document.getElementById('i-risk').value);
  if (bal > 0 && risk > 0) {
    const amt = (bal * risk / 100).toFixed(2);
    document.getElementById('risk-amount').textContent = `$${parseFloat(amt).toLocaleString('en-US', {minimumFractionDigits:2})}`;
  } else {
    document.getElementById('risk-amount').textContent = '— USD';
  }
}

document.getElementById('i-balance').addEventListener('input', updateRiskPreview);
document.getElementById('i-risk').addEventListener('input', updateRiskPreview);

// ===== CALCULATE =====
function calculate() {
  const error = document.getElementById('error-msg');
  error.className = 'error-msg';

  const balance = parseFloat(document.getElementById('i-balance').value);
  const riskPct = parseFloat(document.getElementById('i-risk').value);

  if (!balance || balance <= 0) return showError('กรุณาใส่ Account Balance');
  if (!riskPct || riskPct <= 0 || riskPct > 100) return showError('Risk % ต้องอยู่ระหว่าง 0.1–100');

  const riskAmount = balance * riskPct / 100;
  const inst = INSTRUMENTS[currentInst];
  let pips = 0;

  if (currentMode === 'pips') {
    pips = parseFloat(document.getElementById('i-pips').value);
    if (!pips || pips <= 0) return showError('กรุณาใส่ Stop Loss (pips)');
  } else {
    const entry = parseFloat(document.getElementById('i-entry').value);
    const sl = parseFloat(document.getElementById('i-sl').value);
    if (!entry || !sl) return showError('กรุณาใส่ Entry Price และ Stop Loss Price');
    if (entry === sl) return showError('Entry และ SL ต้องไม่เท่ากัน');
    pips = Math.abs(entry - sl) / inst.pipSize;
  }

  if (pips <= 0) return showError('Stop Loss ต้องมากกว่า 0');

  // Pip value per lot (for USD account)
  let pipValuePerLot = inst.pipValue100k;

  // BTC special: pip = $1, 1 lot = 1 BTC, pip value = $1/pip
  // lotSize = riskAmount / (pips * 1)
  const lotSize = riskAmount / (pips * pipValuePerLot);

  if (!isFinite(lotSize) || lotSize <= 0) return showError('ผลลัพธ์ผิดปกติ กรุณาตรวจสอบค่าที่ใส่');

  // Show result
  document.getElementById('r-lot').textContent = lotSize.toFixed(2);
  document.getElementById('r-sub').textContent = `${pips.toFixed(1)} Pips Risk`;
  document.getElementById('r-risk').textContent = `$${riskAmount.toLocaleString('en-US', {minimumFractionDigits:2})}`;
  document.getElementById('r-pipval').textContent = `${pipValuePerLot.toFixed(2)} USD`;
  document.getElementById('r-units').textContent = Math.round(lotSize * inst.units).toLocaleString('en-US');
  document.getElementById('r-sl').textContent = `${pips.toFixed(1)} pips`;

  document.getElementById('r-standard').textContent = lotSize.toFixed(2);
  document.getElementById('r-mini').textContent = (lotSize * 10).toFixed(2);
  document.getElementById('r-micro').textContent = (lotSize * 100).toFixed(2);

  // Save label
  document.getElementById('save-label').textContent =
    `${inst.label} | ${pips.toFixed(1)}p | $${riskAmount.toFixed(0)} | ${lotSize.toFixed(2)} lots`;

  document.getElementById('result-card').className = 'result-card show';
}

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = '⚠️ ' + msg;
  el.className = 'error-msg show';
  document.getElementById('result-card').className = 'result-card';
}

// ===== SAVE TO MEMORY =====
function saveToMemory() {
  const label = document.getElementById('save-label').textContent;
  const saved = JSON.parse(localStorage.getItem('lsc_history') || '[]');
  saved.unshift({ time: new Date().toLocaleString('th-TH'), data: label });
  if (saved.length > 10) saved.pop();
  localStorage.setItem('lsc_history', JSON.stringify(saved));
  const btn = document.querySelector('.save-btn');
  btn.textContent = '✅ บันทึกแล้ว';
  setTimeout(() => btn.textContent = '💾 บันทึก', 1500);
}

// ===== LOAD SAVED BALANCE =====
const savedBal = localStorage.getItem('lsc_balance');
if (savedBal) document.getElementById('i-balance').value = savedBal;

document.getElementById('i-balance').addEventListener('change', () => {
  localStorage.setItem('lsc_balance', document.getElementById('i-balance').value);
});
</script>
</body>
</html>
